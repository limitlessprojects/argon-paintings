<title>Argon Paintings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
[hidden]{display:none!important}

:root{
  --ground:#EEEEEB;
  --surface:#E2E2DE;
  --ink:#191A18;
  --muted:#686962;
  --rule:#D2D2CC;
  --code-bg:#F6F6F4;
  --c-comment:#8A8B83;
  --c-string:#7A5A20;
  --c-number:#2B5C85;
  --c-title:#5C3E79;
  --c-key:#191A18;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121211;
    --surface:#1D1D1B;
    --ink:#E7E7E2;
    --muted:#8E8F88;
    --rule:#2B2B28;
    --code-bg:#171716;
    --c-comment:#6E6F68;
    --c-string:#D0AF75;
    --c-number:#8DB4D6;
    --c-title:#C4A8DE;
    --c-key:#E7E7E2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121211;
  --surface:#1D1D1B;
  --ink:#E7E7E2;
  --muted:#8E8F88;
  --rule:#2B2B28;
  --code-bg:#171716;
  --c-comment:#6E6F68;
  --c-string:#D0AF75;
  --c-number:#8DB4D6;
  --c-title:#C4A8DE;
  --c-key:#E7E7E2;
}
html.lb-open,html.lb-open body{overflow:hidden}
body{background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.wrap{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:36px}
@media (min-width:720px){.wrap{padding-inline:32px;padding-block:44px 72px;gap:44px}}

.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
.mast h1{margin:0;font-weight:500;font-size:clamp(24px,3.2vw,34px);line-height:1.1;letter-spacing:-0.018em;text-wrap:balance}
.mast p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}

section{display:flex;flex-direction:column;gap:12px}
.label{margin:0;display:flex;gap:10px;align-items:baseline;font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink)}
.label span{color:var(--muted);font-weight:400}

.tile{appearance:none;border:0;padding:0;margin:0;display:block;width:100%;aspect-ratio:1;max-width:100%;
  background-color:var(--surface);background-repeat:no-repeat;cursor:zoom-in;position:relative;overflow:hidden;
  transition:opacity .15s ease}
.tile:hover{opacity:.86}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease}
.tile img.ready{opacity:1}

.reel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;grid-auto-flow:dense}
.reel .big{grid-column:span 2;grid-row:span 2}
@media (min-width:720px){.reel{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}}

.all{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px}
@media (min-width:720px){.all{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}}
#main{gap:12px}
@media (min-width:720px){#main{gap:16px}}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.lb-fig video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}

/* large view */
.lb{position:fixed;inset:0;z-index:20;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;
  --fig:min(calc(100vh - 92px),58vw)}
.lb-bar{flex:none;display:flex;align-items:center;gap:14px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--rule);background:var(--ground)}
.lb-count{font:400 12px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lb-title{flex:1;min-width:0;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-nav{display:flex;gap:6px}
.btn{appearance:none;background:transparent;border:1px solid var(--rule);border-radius:3px;height:30px;min-width:34px;padding:0 10px;
  font:500 12px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn kbd{font:400 11px/1 var(--mono);color:var(--muted)}

.lb-body{flex:1;min-height:0;display:grid;grid-template-columns:var(--fig) minmax(0,1fr);gap:24px;padding:16px 24px}
.lb-fig{margin:0;width:var(--fig);height:var(--fig);max-width:100%;position:relative;background-color:var(--surface);
  background-repeat:no-repeat;touch-action:pan-y}
.lb-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s ease}
.lb-fig img.ready{opacity:1}
.lb-note{position:absolute;left:8px;bottom:8px;margin:0;padding:4px 8px;font:400 11px/1.3 var(--mono);background:var(--ground);color:var(--muted)}

.lb-side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:16px}
.lb-meta{flex:none;max-height:42%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.eyebrow{margin:0;font:400 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-name{margin:0;font-weight:500;font-size:20px;line-height:1.2;letter-spacing:-0.01em;overflow-wrap:anywhere}
.lb-dl{margin:0;display:flex;flex-direction:column;gap:10px}
.lb-dl div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px}

["95fcdca7","sailors-valentine-shells",1,12,1183,88,648486,197692],["cc636472","tracing-overlay-engine",1,13,1501,88,846178,330908],["5f4559b5","cloisonnist-diner-condiments",1,14,1502,88,1177086,174920],["10241254","paint-by-numbers-cherry-pie",1,15,1429,88,1352006,334820]]};
const items = M.items; // [id, slug, round, slot, lines, bundle, offset, length]
const N = items.length, P = M.picks;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const fmt = (n) => n.toLocaleString("en-US");


function sprite(el, i){
  const s = Math.floor(i / M.perSheet), k = i % M.perSheet;
  const cols = M.cols, rows = M.sheetRows[s];
  const c = k % cols, r = Math.floor(k / cols);
  el.style.backgroundSize = (cols * 100) + "% " + (rows * 100) + "%";
  el.style.backgroundPosition = (cols > 1 ? c / (cols - 1) * 100 : 0) + "% " + (rows > 1 ? r / (rows - 1) * 100 : 0) + "%";
  return "sheets/s" + s + ".webp";
}

/* grid */
const all = $("all");
const tiles = new Array(N);
const io = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) { e.target.style.backgroundImage = "url(" + e.target.dataset.src + ")"; io.unobserve(e.target); }
}, { rootMargin: "800px 0px" }) : null;
const fr = document.createDocumentFragment(), fa = document.createDocumentFragment();
for (let i = 0; i < N; i++){
  const it = items[i];
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile";
  b.dataset.i = i;
  b.dataset.src = sprite(b, i);
  b.title = it[1] + " · round " + it[2];
  b.setAttribute("aria-label", it[1] + ", round " + it[2]);
  if (io) io.observe(b); else b.style.backgroundImage = "url(" + b.dataset.src + ")";
  tiles[i] = b;
  fa.appendChild(b);
}
all.appendChild(fa);
function onGrid(e){ const t = e.target.closest(".tile"); if (t) open(+t.dataset.i); }
all.addEventListener("click", onGrid);

/* data */
const bundles = new Map(), blobs = new Map(), codes = new Map(), hl = new Map();
function getBundle(b){
  let p = bundles.get(b);
  if (!p){
    p = fetch("full/b" + pad(b) + ".webp").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); });
    p.catch(() => bundles.delete(b));
    bundles.set(b, p);
  }
  return p;
}
function fullUrl(i){
  if (blobs.has(i)) return Promise.resolve(blobs.get(i));
  const it = items[i];
  return getBundle(it[5]).then((buf) => {
    if (!blobs.has(i)) blobs.set(i, URL.createObjectURL(new Blob([buf.slice(it[6], it[6] + it[7])], { type: "image/webp" })));
    return blobs.get(i);
  });
}
function getCodeBundle(c){
  let p = codes.get(c);
  if (!p){
    p = fetch("code/c" + pad(c) + ".json").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
    p.catch(() => codes.delete(c));
    codes.set(c, p);
  }
  return p;
}
const getCode = (i) => getCodeBundle(Math.floor(i / M.perCode)).then((arr) => arr[i % M.perCode]);

/* large view */
const lb = $("lb"), main = $("main"), fig = $("lb-fig"), img = $("lb-img"), note = $("lb-note");
const pre = $("lb-pre"), codeEl = $("lb-code"), status = $("lb-status");
let cur = -1, lastFocus = null, rec = null, statusT = 0;
let mode = "p"; // "p" paintings, "v" moving paintings
const lbv = $("lb-vid");
const live = (m, i) => mode === m && cur === i;

function open(i, m){
  if (cur < 0){
    mode = m || "p";
    lastFocus = document.activeElement;
    lb.hidden = false;
    document.documentElement.classList.add("lb-open");
    main.inert = true;
    go(i);
    syncPlay();
    $("lb-close").focus({ preventScroll: true });
  } else go(i);
}
function go(i){ if (mode === "v") showV(i); else show(i); }
function close(){
  if (cur < 0) return;
  const t = mode === "v" ? vtiles[cur] : tiles[cur];
  lbv.pause();
  lb.hidden = true;
  document.documentElement.classList.remove("lb-open");
  main.inert = false;
  cur = -1;
  syncPlay();
  if (t){ t.scrollIntoView({ block: "nearest" }); t.focus({ preventScroll: true }); }
  else if (lastFocus) lastFocus.focus({ preventScroll: true });
}
function navLabels(noun){
  $("lb-prev").setAttribute("aria-label", "Previous " + noun);
  $("lb-next").setAttribute("aria-label", "Next " + noun);
}
function show(i){
  i = (i + N) % N;
  cur = i; rec = null;
  const it = items[i];
  if (!lbv.hidden){ lbv.pause(); lbv.hidden = true; }
  img.hidden = false;
  navLabels("painting");
  $("lb-count").textContent = fmt(i + 1) + " / " + fmt(N);
  $("lb-title").textContent = it[1];
  $("lb-name").textContent = it[1];
  $("lb-eyebrow").textContent = "Round " + it[2] + " of " + M.rounds + " · slot " + (it[3] + 1);
  $("lb-lines").textContent = "sketch.js · " + fmt(it[4]) + " lines";
  $("lb-brief").textContent = "…"; $("lb-hint").textContent = "…";
  status.textContent = "";
  note.hidden = true;
  fig.style.backgroundImage = "url(" + sprite(fig, i) + ")";
  img.classList.remove("ready"); img.removeAttribute("src"); img.alt = it[1];
  fullUrl(i).then((u) => {
    if (!live("p", i)) return;
    img.onload = () => { if (live("p", i)) img.classList.add("ready"); };
    img.src = u;
  }).catch(() => { if (live("p", i)) note.hidden = false; });

  codeEl.textContent = "Loading code…";
  pre.scrollTop = 0; pre.scrollLeft = 0;
  if (lb.scrollTop) lb.scrollTop = 0;
  getCode(i).then((r) => {
    if (!live("p", i)) return;
    rec = r;
    $("lb-brief").textContent = r.brief;
    $("lb-hint").textContent = r.hint;
    if (hl.has(i)) { codeEl.innerHTML = hl.get(i); return; }
    codeEl.textContent = r.code;
    setTimeout(() => {
      if (!live("p", i) || !window.hljs) return;
      try {
        const h = window.hljs.highlight(r.code, { language: "javascript", ignoreIllegals: true }).value;
        hl.set(i, h);
        if (live("p", i)) codeEl.innerHTML = h;
      } catch (e) {}
    }, 30);
  }).catch(() => {
    if (!live("p", i)) return;
    codeEl.textContent = "The code didn't load. Check your connection and step to the next painting and back to retry.";
    $("lb-brief").textContent = "Not loaded"; $("lb-hint").textContent = "Not loaded";
  });

  for (const j of [(i + 1) % N, (i - 1 + N) % N, (i + 2) % N]){
    fullUrl(j).catch(() => {});
    getCode(j).catch(() => {});
  }
}

$("lb-prev").addEventListener("click", () => go(cur - 1));
$("lb-next").addEventListener("click", () => go(cur + 1));
$("lb-close").addEventListener("click", close);
document.addEventListener("keydown", (e) => {
  if (cur < 0 || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape"){ e.preventDefault(); close(); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); go(cur - 1); }
});
let tx = null, ty = 0;
fig.addEventListener("touchstart", (e) => { if (e.touches.length !== 1) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
fig.addEventListener("touchend", (e) => {
  if (tx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  tx = null;
  if (Math.abs(dx) > 44 && Math.abs(dx) > 1.4 * Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
}, { passive: true });

/* copy */
function say(msg){ status.textContent = msg; clearTimeout(statusT); statusT = setTimeout(() => { status.textContent = ""; }, 2400); }
function selectCode(){
  const r = document.createRange(); r.selectNodeContents(codeEl);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  say("Selected. Press ⌘C or Ctrl+C");
}
$("lb-copy").addEventListener("click", () => {
  if (!rec) { say("Code is still loading"); return; }
  const lines = mode === "v" ? V[cur][2] : items[cur][4];
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(rec.code).then(() => say("Copied " + fmt(lines) + " lines"), selectCode);
    } else selectCode();
  } catch (e) { selectCode(); }
});

/* moving paintings: [file stem, slug, lines] */
const V = /*REEL*/[["01-xray","xray-handbag-contents",3057],["02-bubbles","opal-sink-foam",2078],["03-rooster","petrykivka-rooster-comb-on-black",2030],["04-vending","vending-machine-cumulus",2692],["05-bowling","pinstripe-candy-bowling-ball",1652],["06-sunglasses","memphis-laminate-sunglasses",1793],["07-windshield","marinelayer-dewy-windshield",2146],["08-pod","space-age-tangerine-bubble-tv",2389],["09-gumball","lowbrow-gumball-eyeball-machine",2775],["10-skillet","gouge-hatched-skillet-egg",2664],["11-zipper","swiss-grid-jacket-zip",2087],["12-bike","shin-hanga-snowy-bicycle-crossing",3151],["13-spill","radar-cola-spill-granite",2276],["14-lawnchair","palm-springs-lawn-chair-poolside",2522],["15-cassette","rave-flyer-chrome-cassette",1654],["16-kettle","de-stijl-chrome-kettle",2579],["17-laundry","blue-hour-laundry-line-rooftop",1951],["18-eye","thinfilm-bubble-wand-eye",1592],["19-accordion","nacre-accordion-keys",2164],["20-microwaves","metabolist-microwave-wall",3172],["21-yellowcoat","step-printed-subway-commuter",2304],["22-truck","fata-morgana-tanker-truck",2416],["23-worker","roadsign-hivis-worker",2225],["24-quiltman","holographic-foil-marathon-cape",2338],["25-toaster","atomic-toaster-crumb-morning",2825],["26-hydrant","whiteout-hydrant-fragment",1691]];
const VN = V.length;
const vgrid = $("vids");
const vtiles = new Array(VN), vids = new Array(VN), vin = new Set();
const rm = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
function wake(i){
  const v = vids[i];
  if (v.dataset.on) return;
  v.dataset.on = "1";
  v.poster = "reel/" + V[i][0] + ".jpg";
  v.src = "reel/" + V[i][0] + ".mp4";
}
function syncPlay(){
  const ok = !rm.matches && cur < 0;
  for (let i = 0; i < VN; i++){
    const v = vids[i];
    if (ok && vin.has(i)){ if (v.paused){ const p = v.play(); if (p) p.catch(() => {}); } }
    else if (!v.paused) v.pause();
  }
  if (rm.matches && !lbv.paused) lbv.pause();
}
const vio = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  for (const e of entries){
    const i = +e.target.dataset.v;
    if (e.isIntersecting){ wake(i); vin.add(i); } else vin.delete(i);
  }
  syncPlay();
}, { rootMargin: "120px 0px" }) : null;
const fv = document.createDocumentFragment();
for (let i = 0; i < VN; i++){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile";
  b.dataset.v = i;
  b.title = V[i][1];
  b.setAttribute("aria-label", V[i][1] + ", moving");
  const v = document.createElement("video");
  v.muted = true; v.defaultMuted = true; v.setAttribute("muted", "");
  v.loop = true; v.playsInline = true; v.setAttribute("playsinline", "");
  v.preload = "none"; v.disablePictureInPicture = true;
  v.setAttribute("aria-hidden", "true"); v.tabIndex = -1;
  b.appendChild(v);
  vtiles[i] = b; vids[i] = v;
  fv.appendChild(b);
  if (vio) vio.observe(b); else { wake(i); vin.add(i); }
}
vgrid.appendChild(fv);
if (!vio) syncPlay();
vgrid.addEventListener("click", (e) => { const t = e.target.closest(".tile"); if (t) open(+t.dataset.v, "v"); });
if (rm.addEventListener) rm.addEventListener("change", syncPlay);

let reelCode = null;
function getReelCode(){
  if (!reelCode){
    reelCode = fetch("reel/code.json").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
    reelCode.catch(() => { reelCode = null; });
  }
  return reelCode;
}
function showV(i){
  i = (i + VN) % VN;
  cur = i; rec = null;
  const it = V[i], key = "v" + i, poster = "reel/" + it[0] + ".jpg";
  navLabels("video");
  $("lb-count").textContent = (i + 1) + " / " + VN;
  $("lb-title").textContent = it[1];
  $("lb-name").textContent = it[1];
  $("lb-eyebrow").textContent = "";
  $("lb-lines").textContent = "sketch.js · " + fmt(it[2]) + " lines";
  status.textContent = "";
  note.hidden = true;
  img.hidden = true; img.classList.remove("ready"); img.removeAttribute("src"); img.alt = "";
  fig.style.backgroundImage = "url(" + poster + ")";
  fig.style.backgroundSize = "contain"; fig.style.backgroundPosition = "50% 50%";
  lbv.hidden = false;
  lbv.muted = true;
  lbv.poster = poster;
  lbv.src = "reel/" + it[0] + ".mp4";
  lbv.setAttribute("aria-label", it[1]);
  if (!rm.matches){ const p = lbv.play(); if (p) p.catch(() => {}); }

  codeEl.textContent = "Loading code…";
  pre.scrollTop = 0; pre.scrollLeft = 0;
  if (lb.scrollTop) lb.scrollTop = 0;
  getReelCode().then((all) => {
    if (!live("v", i)) return;
    const code = all[it[0]];
    if (typeof code !== "string") throw new Error("missing");
    rec = { code };
    if (hl.has(key)) { codeEl.innerHTML = hl.get(key); return; }
    codeEl.textContent = code;
    setTimeout(() => {
      if (!live("v", i) || !window.hljs) return;
      try {
        const h = window.hljs.highlight(code, { language: "javascript", ignoreIllegals: true }).value;
        hl.set(key, h);
        if (live("v", i)) codeEl.innerHTML = h;
      } catch (e) {}
    }, 30);
  }).catch(() => {
    if (live("v", i)) codeEl.textContent = "The code didn't load. Check your connection and step to the next video and back to retry.";
  });
}
lbv.addEventListener("click", () => {
  if (lbv.paused){ const p = lbv.play(); if (p) p.catch(() => {}); } else lbv.pause();
});

/* sharper feature tiles once the first bundle arrives */
const sharpen = () => {
  for (const i of [0, 1]){
    fullUrl(i).then((u) => {
      const im = new Image(); im.alt = ""; im.decoding = "async";
      im.onload = () => im.classList.add("ready");
      im.src = u; tiles[i].appendChild(im);
    }).catch(() => {});
  }
};
if (document.readyState === "complete") setTimeout(sharpen, 200); else window.addEventListener("load", () => setTimeout(sharpen, 200));
})();
